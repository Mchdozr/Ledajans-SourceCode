<style>
    .product-slider-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1rem;
    }
    @media (min-width: 640px) {
      .product-slider-container { padding: 1.5rem; }
    }
    @media (min-width: 1024px) {
      .product-slider-container { padding: 2rem; }
    }
    .product-slider-wrapper {
      position: relative;
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      background: #f3f4f6;
    }
    @media (min-width: 640px) {
      .product-slider-wrapper { border-radius: 1rem; }
    }
    @media (min-width: 1024px) {
      .product-slider-wrapper { border-radius: 1.5rem; }
    }
    .product-slider-viewport {
      position: relative;
      height: 300px;
      width: 100%;
    }
    @media (min-width: 640px) {
      .product-slider-viewport { height: 400px; }
    }
    @media (min-width: 768px) {
      .product-slider-viewport { height: 550px; }
    }
    @media (min-width: 1024px) {
      .product-slider-viewport { height: 650px; }
    }
    .product-slide {
      position: absolute;
      inset: 0;
      transition: opacity 1s ease-in-out;
      opacity: 0;
    }
    .product-slide.active {
      opacity: 1;
    }
    .product-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease-in-out;
    }
    .product-slider-controls {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.375rem;
      z-index: 20;
      flex-wrap: wrap;
      max-width: 90%;
      justify-content: center;
    }
    .product-slider-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 0;
    }
    .product-slider-dot:hover {
      background: rgba(255, 255, 255, 0.7);
      transform: scale(1.2);
    }
    .product-slider-dot.active {
      background: rgba(255, 255, 255, 0.9);
      width: 20px;
      border-radius: 3px;
    }
    .product-slider-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      width: auto;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: all 0.3s ease;
      opacity: 0.6;
      padding: 0.5rem;
    }
    .product-slider-wrapper:hover .product-slider-nav {
      opacity: 1;
    }
    .product-slider-nav:hover {
      transform: translateY(-50%) scale(1.2);
      opacity: 1;
    }
    .product-slider-nav.prev {
      left: 0.5rem;
    }
    .product-slider-nav.next {
      right: 0.5rem;
    }
    .product-slider-nav svg {
      width: 2rem;
      height: 2rem;
      color: white;
      stroke-width: 3;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }
    .product-slider-nav:hover svg {
      color: #F46F2C;
      filter: drop-shadow(0 4px 8px rgba(244, 111, 44, 0.5));
    }
  </style>

  <script>
  (function() {
    var container = document.querySelector('.product-slider-container');
    if (!container) return;
    
    var slides = container.querySelectorAll('.product-slide');
    var dots = container.querySelectorAll('.product-slider-dot');
    var prevBtn = container.querySelector('.product-slider-nav.prev');
    var nextBtn = container.querySelector('.product-slider-nav.next');
    
    var currentSlide = 0;
    var totalSlides = slides.length;
    var autoSlideInterval = null;
    
    setTimeout(function() {
      var visibleSlides = Array.from(slides).filter(function(slide) {
        var img = slide.querySelector('img');
        return img && img.complete && img.naturalHeight !== 0;
      });
      
      if (visibleSlides.length === 0) {
        container.style.display = 'none';
      }
    }, 1000);
    
    function getVisibleSlides() {
      return Array.from(slides).filter(function(slide) {
        var img = slide.querySelector('img');
        return img && img.style.display !== 'none' && slide.style.display !== 'none';
      });
    }
    
    function showSlide(index) {
      var visibleSlides = getVisibleSlides();
      if (visibleSlides.length === 0) return;
      
      if (index < 0) index = visibleSlides.length - 1;
      if (index >= visibleSlides.length) index = 0;
      
      var visibleIndex = 0;
      slides.forEach(function(slide, i) {
        var img = slide.querySelector('img');
        var isVisible = img && img.style.display !== 'none' && slide.style.display !== 'none';
        
        if (isVisible) {
          slide.classList.toggle('active', visibleIndex === index);
          if (visibleIndex < dots.length) {
            dots[i].classList.toggle('active', visibleIndex === index);
          }
          visibleIndex++;
        } else {
          slide.classList.remove('active');
          if (i < dots.length) {
            dots[i].classList.remove('active');
          }
        }
      });
      
      currentSlide = index;
    }
    
    function nextSlide() {
      showSlide(currentSlide + 1);
    }
    
    function prevSlide() {
      showSlide(currentSlide - 1);
    }
    
    function startAutoSlide() {
      autoSlideInterval = setInterval(nextSlide, 5000);
    }
    
    function stopAutoSlide() {
      if (autoSlideInterval) {
        clearInterval(autoSlideInterval);
        autoSlideInterval = null;
      }
    }
    
    if (nextBtn) {
      nextBtn.addEventListener('click', function() {
        nextSlide();
        stopAutoSlide();
        startAutoSlide();
      });
    }
    
    if (prevBtn) {
      prevBtn.addEventListener('click', function() {
        prevSlide();
        stopAutoSlide();
        startAutoSlide();
      });
    }
    
    dots.forEach(function(dot, index) {
      dot.addEventListener('click', function() {
        showSlide(index);
        stopAutoSlide();
        startAutoSlide();
      });
    });
    
    container.addEventListener('mouseenter', stopAutoSlide);
    container.addEventListener('mouseleave', startAutoSlide);
    
    startAutoSlide();
  })();
  </script>
