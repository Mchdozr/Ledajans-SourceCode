<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>LEDAJANS — Kapak</title>
  <link rel="stylesheet" href="../assets/katalog.css">
  <style>
    .cover { display: flex; flex-direction: column; }
    .cover-top {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20mm var(--margin) 10mm;
      position: relative;
    }
    .cover-hero-frame {
      width: 140mm;
      height: 90mm;
      border: 2px solid var(--brand-orange);
      border-radius: 4px;
      padding: 4px;
      position: relative;
      margin: 16mm 0;
    }
    .cover-hero-frame::before {
      content: '';
      position: absolute;
      inset: -8px;
      border: 1px solid rgba(244,111,44,.3);
      border-radius: 6px;
    }
    .cover-hero-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 2px;
    }
    .cover-bottom {
      background: var(--brand-dark);
      padding: 12mm var(--margin);
      position: relative;
    }
    .cover-bottom::before {
      content: '';
      position: absolute;
      top: -20mm;
      left: 0;
      right: 0;
      height: 20mm;
      background: var(--brand-dark);
      clip-path: polygon(0 100%, 100% 0, 100% 100%);
    }
    .cover-bottom-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12mm;
      align-items: end;
    }
    .cover-categories {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .cover-categories li {
      font-size: 8.5pt;
      color: rgba(255,255,255,.85);
      padding-left: 12px;
      position: relative;
    }
    .cover-categories li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      width: 4px;
      height: 4px;
      background: var(--brand-orange);
      border-radius: 50%;
    }
    .cover-stripe {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4mm;
      background: var(--brand-orange);
    }
    .chevrons {
      display: flex;
      flex-direction: column;
      gap: 3px;
      opacity: .4;
    }
    .chevron {
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 8px solid rgba(255,255,255,.5);
    }
  </style>
</head>
<body>
  <div class="page cover">
    <div class="cover-top">
      <div class="logo">
        <div class="logo-icon"></div>
        <span class="logo-text">LEDAJANS</span>
      </div>

      <div class="cover-hero-frame">
        <img src="https://ledajans.com/wp-content/uploads/2022/12/6ba71365-5d3f-4975-9104-a2219747265f.jpg" alt="LED Ekran Uygulamaları">
      </div>
    </div>

    <div class="cover-bottom">
      <div class="cover-bottom-inner">
        <div>
          <p class="heading-sm text-white" style="margin-bottom:6px;opacity:.7">LED DISPLAY SYSTEMS</p>
          <div class="accent-bar" style="margin-bottom:10px"></div>
          <div class="chevrons">
            <div class="chevron"></div>
            <div class="chevron"></div>
            <div class="chevron"></div>
          </div>
        </div>
        <div>
          <h1 style="margin-bottom:12px">
            <span class="heading-lg text-accent">Product</span><br>
            <span class="heading-lg text-white">Catalog</span>
          </h1>
          <ul class="cover-categories">
            <li>LED Display / Screen</li>
            <li>LED Moving Signs</li>
            <li>LED Module</li>
            <li>Control Cards</li>
            <li>Power Supply</li>
            <li>Accessories</li>
          </ul>
        </div>
      </div>
      <div class="cover-stripe"></div>
    </div>
  </div>
</body>
</html>
