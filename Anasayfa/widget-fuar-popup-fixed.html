<!-- Fuar Popup - Clean HTML/CSS (Elementor HTML widget) -->
<style>
  #la-fuar-popup {
    position: relative;
    color: #fff;
  }

  #la-fuar-popup .la-fuar-inner {
    position: relative;
    border-radius: 24px;
    padding: 24px 20px 20px;
    background: linear-gradient(165deg, #0f172a 0%, #1e293b 100%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 20px 60px rgba(2, 6, 23, 0.5);
    overflow: hidden;
  }

  #la-fuar-popup .la-fuar-title {
    margin: 0 0 10px;
    font-size: 36px;
    line-height: 1.05;
    font-weight: 900;
    letter-spacing: -0.02em;
  }

  #la-fuar-popup .la-fuar-desc {
    margin: 0 0 14px;
    font-size: 17px;
    line-height: 1.45;
    color: #dbe3ef;
    font-weight: 500;
  }

  #la-fuar-popup .la-fuar-info-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    font-size: 14px;
    color: #fed7aa;
  }

  #la-fuar-popup .la-count-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 14px;
  }

  #la-fuar-popup .la-count-box {
    border-radius: 14px;
    padding: 8px 6px;
    text-align: center;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
  }

  #la-fuar-popup .la-count-box span {
    display: block;
    font-size: 24px;
    line-height: 1;
    font-weight: 800;
    color: #fff;
  }

  #la-fuar-popup .la-count-box small {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    line-height: 1.2;
    color: #dbe3ef;
    font-weight: 500;
  }

  #la-fuar-popup .la-fuar-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 50px;
    border-radius: 999px;
    text-decoration: none;
    font-size: 17px;
    font-weight: 800;
    line-height: 1;
    color: #fff;
    background: linear-gradient(135deg, #f46f2c 0%, #ea580c 100%);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 12px 28px rgba(244, 111, 44, 0.4);
  }

  #la-fuar-popup .la-fuar-cta:hover {
    color: #fff;
    filter: brightness(1.05);
  }

  @media (max-width: 560px) {
    #la-fuar-popup .la-fuar-inner {
      padding: 20px 16px 16px;
    }

    #la-fuar-popup .la-fuar-title {
      font-size: 30px;
    }

    #la-fuar-popup .la-fuar-desc {
      font-size: 15px;
    }

    #la-fuar-popup .la-count-box span {
      font-size: 20px;
    }

    #la-fuar-popup .la-count-box small {
      font-size: 10px;
    }
  }
</style>

<section id="la-fuar-popup" aria-label="Fuar buluşması sayacı">
  <div class="la-fuar-inner">
    <h2 class="la-fuar-title">Fuar Buluşması</h2>
    <p class="la-fuar-desc">
      6 Haziran 2026 13:00, TÜYAP Salon 8 Stand 821A.
    </p>

    <div class="la-fuar-info-row">
      <strong>Geri Sayım</strong>
      <span>Canlı olarak güncellenir</span>
    </div>

    <div id="laCountWrap" class="la-count-grid" aria-live="polite">
      <div class="la-count-box">
        <span id="laDays">00</span>
        <small>Gün</small>
      </div>
      <div class="la-count-box">
        <span id="laHours">00</span>
        <small>Saat</small>
      </div>
      <div class="la-count-box">
        <span id="laMinutes">00</span>
        <small>Dakika</small>
      </div>
      <div class="la-count-box">
        <span id="laSeconds">00</span>
        <small>Saniye</small>
      </div>
    </div>

    <a class="la-fuar-cta" href="https://ledajans.com/iletisim/" target="_blank" rel="noopener">
      Bilgi Al / Randevu Oluştur
    </a>
  </div>
</section>
