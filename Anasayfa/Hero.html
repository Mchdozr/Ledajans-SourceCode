<style>
    .ledajans-video-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    .ledajans-video-modal.active { display: flex; }
    .ledajans-video-modal-content { position: relative; width: 90%; max-width: 900px; }
    .ledajans-video-modal-close {
      position: absolute;
      top: -40px;
      right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 36px;
      cursor: pointer;
      padding: 10px;
      z-index: 10000;
    }
    .ledajans-video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
    }
    .ledajans-video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    .ledajans-hero {
      position: relative;
      height: 100vh;
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #111827;
      box-sizing: border-box;
    }
    .ledajans-hero-video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .ledajans-hero-video.loaded { opacity: 1; }
    .ledajans-hero-poster {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      z-index: 0;
    }
    @media (min-width: 769px) {
      .ledajans-hero-poster {
        background-image: url('https://ledajans.com/wp-content/uploads/2026/04/hero-poster.webp');
      }
    }
    .ledajans-hero-bg-mobile {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .ledajans-hero-bg-mobile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .ledajans-hero-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.65);
      z-index: 1;
      pointer-events: none;
    }
    .ledajans-hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 0 1rem;
      transform: translateY(-25px);
    }
    .ledajans-play-wrap {
      display: block;
      margin: 0 auto 1.5rem;
      position: relative;
      z-index: 50;
      width: 80px;
      height: 80px;
    }
    .ledajans-play-wrap a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background-color: #F46F2C;
      border-radius: 50%;
      box-shadow: 0 10px 40px rgba(244, 111, 44, 0.4);
      transition: transform 0.3s ease, background-color 0.3s ease;
      animation: ledajans-pulse 2s infinite;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .ledajans-play-wrap a:hover {
      transform: scale(1.1);
      background-color: #e55a1f;
    }
    .ledajans-play-wrap a:active {
      transform: scale(0.95);
      background-color: #d14e15;
    }
    .ledajans-play-icon {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 16px 0 16px 28px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 6px;
      display: block;
    }
    @keyframes ledajans-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .ledajans-hero-title {
      font-size: 4.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .ledajans-hero-subtitle {
      font-size: 1.25rem;
      color: #e5e7eb;
      margin-bottom: 3rem;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      font-weight: 300;
      line-height: 1.6;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.5);
    }
    .ledajans-hero-buttons {
      display: flex;
      flex-direction: row;
      gap: 2.5rem;
      justify-content: center;
      align-items: center;
    }
    .ledajans-btn-primary, .ledajans-btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 2.5rem;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 12px;
      text-decoration: none;
      min-width: 247px;
      height: 64px;
      transition: all 0.3s ease;
      position: relative;
      z-index: 20;
    }
    .ledajans-btn-primary {
      background-color: #F46F2C;
      color: #fff;
      box-shadow: 0 4px 20px rgba(244, 111, 44, 0.3);
    }
    .ledajans-btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(244, 111, 44, 0.5);
      color: #fff;
    }
    .ledajans-btn-secondary {
      background-color: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border: 2px solid #fff;

    }
    .ledajans-btn-secondary:hover {
      background-color: #fff;
      color: #1a1a1a;
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .ledajans-hero {
        height: auto;
        min-height: 100svh;

      .ledajans-hero-video { display: none !important; }
      .ledajans-hero-poster { display: none; }

      .ledajans-hero-content {

        margin-left: 5px;
      }
      .ledajans-hero-title { font-size: 2.5rem; }
      .ledajans-hero-subtitle { font-size: 1rem; }
      .ledajans-hero-buttons { flex-direction: column; gap: 1rem; }
      .ledajans-btn-primary, .ledajans-btn-secondary { width: 100%; max-width: 280px; }
    }

        <div class="ledajans-video-wrapper">
          <iframe id="ledajansYoutubeFrame" src="" title="LEDAJANS tanıtım videosu" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

    <script>
    (function(){
      var playLink = document.getElementById('ledajansPlayBtn');
      var modal = document.getElementById('ledajansVideoModal');
      var frame = document.getElementById('ledajansYoutubeFrame');
      var closeBtn = document.getElementById('ledajansModalClose');
      var youtubeUrl = 'https://www.youtube.com/embed/riOY6kz7cv4?autoplay=1';
      var modalOpen = false;
      function openModal() {
        if (modalOpen) return;
        modalOpen = true;
        if (modal) modal.classList.add('active');
        if (frame) frame.src = youtubeUrl;
        document.body.style.overflow = 'hidden';
      }
      function closeModal() {
        modalOpen = false;
        if (modal) modal.classList.remove('active');
        if (frame) frame.src = '';
        document.body.style.overflow = '';
      }
      if (playLink) {
        playLink.onclick = function(e) { e.preventDefault(); e.stopPropagation(); openModal(); return false; };
        playLink.ontouchend = function(e) { e.preventDefault(); e.stopPropagation(); openModal(); return false; };
      }
      if (closeBtn) {
        closeBtn.onclick = function(e) { e.preventDefault(); closeModal(); return false; };
        closeBtn.ontouchend = function(e) { e.preventDefault(); closeModal(); return false; };
      }
      if (modal) {
        modal.onclick = function(e) { if (e.target === modal) closeModal(); };
        modal.ontouchend = function(e) { if (e.target === modal) { e.preventDefault(); closeModal(); } };
      }
      document.onkeydown = function(e) { if (e.key === 'Escape') closeModal(); };
      var heroVideo = document.getElementById('ledajansHeroVideo');
      if (heroVideo && window.innerWidth > 768) {
        heroVideo.muted = true;
        var posterSrc = heroVideo.getAttribute('data-poster');
        if (posterSrc) {
          heroVideo.setAttribute('poster', posterSrc);
        }
        var videoSrc = heroVideo.getAttribute('data-src');
        var videoLoaded = false;

        function loadAndPlay() {
          if (videoLoaded || !videoSrc) return;
          videoLoaded = true;
          var source = document.createElement('source');
          source.src = videoSrc;
          source.type = 'video/mp4';
          heroVideo.appendChild(source);
          heroVideo.load();
          heroVideo.muted = true;
        }

        heroVideo.addEventListener('canplay', function() {
          heroVideo.muted = true;
          heroVideo.classList.add('loaded');
          try { heroVideo.play(); } catch(ex) {}
        });

        if ('connection' in navigator && navigator.connection.saveData) {
          return;
        }

        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadAndPlay, { timeout: 4000 });
        } else {
          setTimeout(loadAndPlay, 2500);
        }
      }
    })();
    </script>
