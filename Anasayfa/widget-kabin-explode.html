<!-- WIDGET — LED kabin scroll explode | Elementor HTML (tamamı yapıştır) | Ek CSS gerekmez -->
<!-- Elementor: tam genişlik, overflow visible. Görseller WP Medya'ya yüklenince data-asset-base güncelle. Canlı yayın onay ister. -->
<!-- Adobe gerekmez. İstersen PS'de katman WEBP; AE+Lottie 3D explode opsiyonel — video LCP'yi bozar, bu widget scroll ile açar. -->
<style>
  .la-explode {
    --p: 0;
    --la-orange: #F46F2C;
    --la-ink: #f8fafc;
    --la-muted: #cbd5e1;
    background: #05070c;
    color: var(--la-ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .la-explode-runway {
    position: relative;
    height: 240vh;
  }
  .la-explode-view {
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 4.75rem 1rem 1.25rem;
    box-sizing: border-box;
    overflow: hidden;
  }
  .la-explode-view::before {
    content: "";
    position: absolute;
    inset: 18% 22%;
    background: radial-gradient(ellipse at center, rgba(244, 111, 44, 0.16), transparent 68%);
    pointer-events: none;
    opacity: calc(0.35 + (1 - var(--p)) * 0.55);
    z-index: 0;
  }
  .la-explode-copy {
    position: relative;
    z-index: 3;
    text-align: center;
    max-width: 42rem;
    margin: 0 auto 0.35rem;
  }
  .la-explode-kicker {
    display: inline-flex;
    margin: 0 0 0.55rem;
    padding: 0.28rem 0.7rem;
    border-radius: 999px;
    border: 1px solid rgba(244, 111, 44, 0.5);
    background: rgba(244, 111, 44, 0.12);
    color: #fdba74;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .la-explode-title {
    margin: 0 0 0.4rem;
    font-size: clamp(1.55rem, 3.4vw, 2.55rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.12;
    color: #fff;
  }
  .la-explode-title span { color: var(--la-orange); }
  .la-explode-desc {
    margin: 0 auto;
    max-width: 34rem;
    color: var(--la-muted);
    font-size: 0.98rem;
    line-height: 1.55;
    font-weight: 400;
  }
  .la-explode-stage-wrap {
    position: relative;
    z-index: 2;
    width: min(1080px, 96vw);
    margin: 0.2rem auto 0;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .la-explode-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 2560 / 1921;
    max-height: min(62vh, 640px);
    max-height: min(62dvh, 640px);
  }
  .la-explode-layer {
    position: absolute;
    inset: 0;
    transform: translate3d(
      calc((1 - var(--p)) * var(--ax) * 100%),
      calc((1 - var(--p)) * var(--ay) * 100%),
      0
    ) rotate(calc(var(--p) * var(--rot)));
    will-change: transform;
    pointer-events: none;
  }
  .la-explode-layer img {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--w);
    height: var(--h);
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.45));
  }
  .la-explode-layer--maske { --ax: 0.391; --ay: 0.063; --rot: -6deg; --x: 8.67%; --y: 36.44%; --w: 4.45%; --h: 20.72%; z-index: 5; }
  .la-explode-layer--modul { --ax: 0.276; --ay: 0.008; --rot: -3deg; --x: 13.55%; --y: 28.16%; --w: 17.66%; --h: 48.31%; z-index: 4; }
  .la-explode-layer--pcb { --ax: 0.032; --ay: -0.047; --rot: 2deg; --x: 37.27%; --y: 46.90%; --w: 19.14%; --h: 21.81%; z-index: 3; }
  .la-explode-layer--kabin { --ax: -0.238; --ay: -0.018; --rot: 5deg; --x: 58.59%; --y: 34.77%; --w: 30.31%; --h: 40.19%; z-index: 2; }
  .la-explode-label {
    position: absolute;
    left: var(--lx);
    top: var(--ly);
    display: flex;
    align-items: center;
    gap: 0.4rem;
    color: #fff;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    white-space: nowrap;
    opacity: var(--p);
    pointer-events: none;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
  }
  .la-explode-label i {
    width: 7px;
    height: 7px;
    border-radius: 99px;
    background: var(--la-orange);
    box-shadow: 0 0 0 4px rgba(244, 111, 44, 0.2);
    flex-shrink: 0;
  }
  .la-explode-layer--maske .la-explode-label { --lx: -9%; --ly: 28%; }
  .la-explode-layer--modul .la-explode-label { --lx: 4%; --ly: 18%; }
  .la-explode-layer--pcb .la-explode-label { --lx: 42%; --ly: 71%; }
  .la-explode-layer--kabin .la-explode-label { --lx: 88%; --ly: 26%; }
  .la-explode-foot {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.15rem;
  }
  .la-explode-progress {
    width: min(280px, 70vw);
    height: 3px;
    border-radius: 99px;
    background: rgba(148, 163, 184, 0.28);
    overflow: hidden;
  }
  .la-explode-progress > span {
    display: block;
    height: 100%;
    width: calc(var(--p) * 100%);
    background: linear-gradient(90deg, #f46f2c, #fdba74);
  }
  .la-explode-hint {
    margin: 0;
    font-size: 0.75rem;
    color: #94a3b8;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .la-explode-ctas {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
    justify-content: center;
  }
  .la-explode-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0.55rem 1.15rem;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.92rem;
    text-decoration: none;
  }
  .la-explode-btn-primary {
    background: var(--la-orange);
    color: #fff;
    box-shadow: 0 8px 20px rgba(244, 111, 44, 0.32);
  }
  .la-explode-btn-primary:hover { background: #e55a1f; color: #fff; }
  .la-explode-btn-ghost {
    border: 1px solid rgba(255, 255, 255, 0.28);
    color: #fff;
    background: rgba(255, 255, 255, 0.06);
  }
  .la-explode-btn-ghost:hover { background: #fff; color: #111827; }
  .la-explode.is-reduced .la-explode-runway { height: auto; }
  .la-explode.is-reduced .la-explode-view { position: relative; height: auto; min-height: 100svh; }
  .la-explode.is-reduced { --p: 1; }
  @media (max-width: 768px) {
    .la-explode-runway { height: 190vh; }
    .la-explode-view { padding-top: 4.25rem; padding-bottom: 1rem; }
    .la-explode-desc { font-size: 0.9rem; }
    .la-explode-label { font-size: 0.68rem; }
    .la-explode-layer--kabin .la-explode-label { --lx: 72%; --ly: 22%; }
    .la-explode-stage { max-height: min(48dvh, 420px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .la-explode { --p: 1; }
    .la-explode-runway { height: auto; }
    .la-explode-view { position: relative; height: auto; min-height: 100svh; }
    .la-explode-layer, .la-explode-label { transform: none; }
  }
</style>

<section class="la-explode" id="laKabinExplode" data-asset-base="assets/kabin-explode" aria-label="LED kabin katmanları">
  <div class="la-explode-runway">
    <div class="la-explode-view">
      <div class="la-explode-copy">
        <p class="la-explode-kicker">Modüler kabin</p>
        <h2 class="la-explode-title">Bütünden <span>parçaya</span></h2>
        <p class="la-explode-desc">Kaydırdıkça LED kabin açılır: maske, modül, sürücü kartı ve döküm kasa servis sırasına göre ayrılır.</p>
      </div>
      <div class="la-explode-stage-wrap">
        <div class="la-explode-stage" role="img" aria-label="LED kabin parçalarının kaydırmayla ayrılması">
          <div class="la-explode-layer la-explode-layer--kabin">
            <img data-file="part-kabin.webp" alt="" width="776" height="772" decoding="async" loading="lazy">
            <span class="la-explode-label"><i></i>Döküm kabin</span>
          </div>
          <div class="la-explode-layer la-explode-layer--pcb">
            <img data-file="part-pcb.webp" alt="" width="490" height="419" decoding="async" loading="lazy">
            <span class="la-explode-label"><i></i>Sürücü kartı</span>
          </div>
          <div class="la-explode-layer la-explode-layer--modul">
            <img data-file="part-modul.webp" alt="" width="452" height="928" decoding="async" loading="lazy">
            <span class="la-explode-label"><i></i>LED modül</span>
          </div>
          <div class="la-explode-layer la-explode-layer--maske">
            <img data-file="part-maske.webp" alt="" width="114" height="398" decoding="async" loading="lazy">
            <span class="la-explode-label"><i></i>Maske</span>
          </div>
        </div>
      </div>
      <div class="la-explode-foot">
        <div class="la-explode-progress" aria-hidden="true"><span></span></div>
        <p class="la-explode-hint">Aşağı kaydırın</p>
        <div class="la-explode-ctas">
          <a class="la-explode-btn la-explode-btn-primary" href="https://ledajans.com/ic-mekan-led-ekran/">İç mekan LED ekran</a>
          <a class="la-explode-btn la-explode-btn-ghost" href="https://ledajans.com/iletisim/">Teklif alın</a>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
(function () {
  var root = document.getElementById('laKabinExplode');
  if (!root) return;
  var base = (root.getAttribute('data-asset-base') || 'assets/kabin-explode').replace(/\/?$/, '/');
  var imgs = root.querySelectorAll('img[data-file]');
  for (var i = 0; i < imgs.length; i++) {
    if (!imgs[i].getAttribute('src')) imgs[i].src = base + imgs[i].getAttribute('data-file');
  }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    root.classList.add('is-reduced');
    root.style.setProperty('--p', '1');
    return;
  }
  var runway = root.querySelector('.la-explode-runway');
  var hint = root.querySelector('.la-explode-hint');
  var ticking = false;
  function setP(v) {
    var p = v < 0 ? 0 : v > 1 ? 1 : v;
    root.style.setProperty('--p', p.toFixed(4));
    if (hint) hint.textContent = p > 0.92 ? 'Kabin açık' : p < 0.08 ? 'Aşağı kaydırın' : 'Parçalar ayrılıyor';
  }
  function measure() {
    var rect = runway.getBoundingClientRect();
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var travel = Math.max(1, rect.height - vh);
    setP(-rect.top / travel);
  }
  function onScroll() {
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(function () {
      measure();
      ticking = false;
    });
  }
  var n = root.parentElement;
  var hops = 0;
  while (n && hops < 10) {
    if (n.classList && (n.classList.contains('elementor-element') || n.classList.contains('elementor-widget') || n.classList.contains('elementor-section') || n.classList.contains('elementor-widget-html'))) {
      n.style.overflow = 'visible';
    }
    n = n.parentElement;
    hops += 1;
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      if (entries[0] && entries[0].isIntersecting) measure();
    }, { threshold: 0 });
    io.observe(root);
  }
  measure();
})();
</script>
