<script>
(function () {
  var play = document.getElementById("la1Play");
  var modal = document.getElementById("la1Modal");
  var frame = document.getElementById("la1Frame");
  var closeBtn = document.getElementById("la1Close");
  var yt = "https://www.youtube.com/embed/riOY6kz7cv4?autoplay=1";
  function openModal() {
    if (!modal) return;
    modal.hidden = false;
    modal.classList.add("is-open");
    if (frame) frame.src = yt;
    document.body.style.overflow = "hidden";
  }
  function closeModal() {
    if (!modal) return;
    modal.classList.remove("is-open");
    modal.hidden = true;
    if (frame) frame.src = "";
    document.body.style.overflow = "";
  }
  if (play) play.addEventListener("click", function (e) { e.preventDefault(); openModal(); });
  if (closeBtn) closeBtn.addEventListener("click", closeModal);
  if (modal) modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  var video = document.getElementById("la1Video");
  if (!video || window.innerWidth <= 768) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (navigator.connection && navigator.connection.saveData) return;
  video.muted = true;
  video.loop = false;
  video.removeAttribute("loop");
  var poster = video.getAttribute("data-poster");
  if (poster) video.setAttribute("poster", poster);
  var src = video.getAttribute("data-src");
  var loaded = false;
  var playedOnce = false;
  function freeze() {
    video.pause();
    try {
      if (video.duration && isFinite(video.duration) && video.duration > 0.08) {
        video.currentTime = Math.max(0, video.duration - 0.05);
      }
    } catch (ex) {}
    video.classList.add("is-on");
  }
  function loadAndPlay() {
    if (loaded || !src || playedOnce) return;
    loaded = true;
    var source = document.createElement("source");
    source.src = src;
    source.type = "video/mp4";
    video.appendChild(source);
    video.load();
  }
  video.addEventListener("canplay", function () {
    video.classList.add("is-on");
    if (playedOnce || video.ended) return;
    try { video.play(); } catch (ex) {}
  });
  video.addEventListener("ended", function () { playedOnce = true; freeze(); });
  video.addEventListener("play", function () { if (playedOnce) freeze(); });
  if ("requestIdleCallback" in window) requestIdleCallback(loadAndPlay, { timeout: 4000 });
  else setTimeout(loadAndPlay, 2500);
})();
</script>
