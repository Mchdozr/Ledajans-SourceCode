<script id="ledajans-logo-swap">
(function () {
  var HEADER = 'https://ledajans.com/wp-content/uploads/2026/09/ledajans-ust-menu-logo.webp';
  var FOOTER = 'https://ledajans.com/wp-content/uploads/2022/12/LedajansLogo.png';
  var re = /LedajansLogo|ledajans-logo|leadajans-logo/i;
  function apply() {
    document.querySelectorAll(".elementor-element-123bc72 .site-branding-logo img, .logo-mm img").forEach(function (img) {
      if ((img.getAttribute("src") || "") !== HEADER) {
        img.setAttribute("src", HEADER);
        img.setAttribute("data-src", HEADER);
      }
    });
    document.querySelectorAll("img.ledajans-footer-logo").forEach(function (img) {
      img.setAttribute("src", FOOTER);
      img.setAttribute("data-src", FOOTER);
    });
    document.querySelectorAll("img").forEach(function (img) {
      if (img.classList.contains("ledajans-footer-logo") || img.closest(".ledajans-footer")) return;
      if (img.closest(".elementor-element-123bc72 .site-branding-logo, .logo-mm")) return;
      var s = img.getAttribute("src") || "";
      var hit = re.test(s) || img.closest(".gsc-logo");
      if (hit && s !== HEADER) {
        img.setAttribute("src", HEADER);
        img.setAttribute("data-src", HEADER);
      }
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", apply);
  else apply();
})();
</script>

<script id="ledajans-header-identity-js">
(function () {
  function dropThemeCanvas() {
    document.querySelectorAll(".wrapper-page > .canvas-mobile, .wrapper-page > #gva-overlay").forEach(function (el) {
      el.remove();
    });
  }
  function lockTrLabels() {
    var map = {
      "Contact Us": "İletişim",
      Kontakt: "İletişim",
      Contact: "İletişim",
      Home: "Anasayfa",
      Startseite: "Anasayfa"
    };
    document.querySelectorAll(
      "#menu-anamenu-desktop .menu-title, .elementor-element-123bc72 .gva-main-menu > li > a .menu-title"
    ).forEach(function (el) {
      var t = (el.textContent || "").trim();
      if (map[t]) el.textContent = map[t];
    });
    document.querySelectorAll("header.wp-site-header, #menu-anamenu-desktop").forEach(function (el) {
      el.setAttribute("translate", "no");
    });
  }
  function run() {
    dropThemeCanvas();
    lockTrLabels();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run);
  else run();
})();
</script>
