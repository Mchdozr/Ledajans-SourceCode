  UYGULAMA ADIMLARI:

  1. TLS SERTİFİKA KONTROLÜ:
     - Plesk Panel > Websites & Domains > SSL/TLS Certificates
     - Sertifikanın hem "ledajans.com" hem "www.ledajans.com" için geçerli olduğunu doğrulayın
     - Let's Encrypt kullanılıyorsa: "Include www" seçeneği aktif olmalı

     Plesk Panel > Apache & nginx Settings veya public_html/.htaccess:

     RewriteEngine On

     RewriteRule ^(.*)$ https://ledajans.com/$1 [R=301,L]

     server {

<!-- ============================================================
  5b. CACHE-CONTROL HEADER DÜZELTMESİ (P1)
  ============================================================

  SORUN:
  - HTTP yanıtlarında çift Cache-Control header görülüyor (tutarsızlık riski).
  - Bu durum CDN ve tarayıcı önbellekleme davranışını bozabilir.

  NEDEN:
  - WordPress veya eklenti seviyesinde bir Cache-Control ayarı var
  - Sunucu (Apache/nginx) seviyesinde ayrı bir Cache-Control ayarı var
  - İki katman çakışıyor

  ÇÖZÜM ADIMLARI:

  1. MEVCUT HEADER'LARI KONTROL ET:
     curl -I https://ledajans.com/ | grep -i cache-control
     (İki satır görüyorsanız çakışma var)

  2. SUNUCU SEVİYESİ (Plesk):
     Plesk > Apache & nginx Settings > Additional directives:
     
     Apache (.htaccess):
     <IfModule mod_headers.c>
       Header set Cache-Control "public, max-age=31536000, immutable" env=!no-cache
     </IfModule>

     Nginx:
     add_header Cache-Control "public, max-age=31536000, immutable";

  3. WORDPRESS SEVİYESİ:
     - W3 Total Cache / LiteSpeed Cache / WP Super Cache eklentisinde
       cache header ayarını kontrol edin
     - Eklenti ve sunucu aynı anda header gönderiyorsa, eklenti tarafını devre dışı bırakın
       ve sunucu seviyesinden yönetin

  4. ÖNERİLEN CACHE POLİTİKASI:
     - Statik varlıklar (CSS/JS/resim): max-age=31536000, immutable
     - HTML sayfalar: no-cache, must-revalidate (veya max-age=3600)
     - API yanıtları: no-store
