<!-- Program İndir - Uzak Masa Üstü & Tarama Dosyaları Bölümü -->
<style>
    .program-indir-section {
      padding: 4rem 1rem;
      background: linear-gradient(180deg, #f9fafb 0%, #ffffff 100%);
    }
    
    .program-indir-container {
      max-width: 1280px;
      margin: 0 auto;
    }
    
    /* --- Uzak Masa Üstü Programları --- */
    .program-remote-block {
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 10px 15px -3px rgba(0, 0, 0, 0.08);
      padding: 2.5rem 1.5rem;
      margin-bottom: 3rem;
      border: 1px solid rgba(244, 111, 44, 0.12);
    }
    
    @media (min-width: 768px) {
      .program-remote-block {
        padding: 3rem 2.5rem;
        border-radius: 1.25rem;
      }
    }
    
    .program-remote-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #111827;
      margin: 0 0 0.5rem 0;
      text-align: center;
    }
    
    @media (min-width: 768px) {
      .program-remote-title { font-size: 2rem; }
    }
    
    .program-remote-title .highlight {
      color: #F46F2C;
    }
    
    .program-remote-desc {
      font-size: 1rem;
      color: #4B5563;
      text-align: center;
      max-width: 560px;
      margin: 0 auto 2.5rem auto;
      line-height: 1.6;
    }
    
    .program-remote-icons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
      max-width: 640px;
      margin: 0 auto;
    }
    
    @media (min-width: 640px) {
      .program-remote-icons {
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
      }
    }
    
    .program-remote-icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 1.25rem 0.75rem;
      background: #f9fafb;
      border-radius: 0.75rem;
      transition: background 0.2s, transform 0.2s;
    }
    
    .program-remote-icon-item:hover {
      background: #fff7ed;
      transform: translateY(-2px);
    }
    
    .program-remote-icon-item .icon-wrap {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(244, 111, 44, 0.12);
      color: #F46F2C;
    }
    
    .program-remote-icon-item .icon-wrap svg {
      width: 24px;
      height: 24px;
    }
    
    .program-remote-icon-item span {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #374151;
      text-align: center;
      line-height: 1.3;
    }
    
    @media (min-width: 640px) {
      .program-remote-icon-item span { font-size: 0.875rem; }
    }
    
    /* --- Tarama Dosyaları --- */
    .program-tarama-block {
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      border-radius: 1rem;
      padding: 2.5rem 1.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .program-tarama-block::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #F46F2C, transparent);
      opacity: 0.8;
    }
    
    @media (min-width: 768px) {
      .program-tarama-block {
        padding: 3rem 2rem;
        border-radius: 1.25rem;
      }
    }
    
    .program-tarama-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 0.75rem 0;
    }
    
    @media (min-width: 768px) {
      .program-tarama-title { font-size: 1.75rem; }
    }
    
    .program-tarama-desc {
      font-size: 1rem;
      color: #d1d5db;
      margin: 0 0 1.5rem 0;
      line-height: 1.5;
    }
    
    .program-tarama-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 1.75rem;
      background: #F46F2C;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 0.5rem;
      transition: background 0.2s, transform 0.2s;
      border: none;
      cursor: pointer;
    }
    
    .program-tarama-cta:hover {
      background: #e55a1a;
      transform: translateY(-1px);
      color: #ffffff;
    }
    
    .program-tarama-cta svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    </style>
