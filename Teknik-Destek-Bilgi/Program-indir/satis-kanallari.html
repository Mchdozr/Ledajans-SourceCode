<!-- LEDAJANS Satış Kanallarımız - Program İndir -->
<style>
  .ledajans-channels *,
  .ledajans-channels *::before,
  .ledajans-channels *::after { box-sizing: border-box; }
  .ledajans-channels {
    max-width: 1280px;
    margin: 0 auto;
    padding: clamp(2rem, 5vw, 3.5rem) max(1rem, env(safe-area-inset-left));
    padding-right: max(1rem, env(safe-area-inset-right));
    margin-bottom: 4rem;
    font-family: inherit;
    background: transparent;
  }
  .ledajans-channels-title {
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 700;
    color: #1f2937;
    margin: 0 0 0.5rem 0;
    text-align: center;
    letter-spacing: -0.025em;
  }
  .ledajans-channels-sub {
    margin: 0 auto 1.75rem auto;
    max-width: 36rem;
    text-align: center;
    font-size: 0.9375rem;
    color: #6b7280;
    line-height: 1.6;
  }
  .ledajans-channels-grid {
    display: grid;
    gap: 1rem;
    grid-template-columns: 1fr;
  }
  @media (min-width: 560px) {
    .ledajans-channels-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 1.15rem;
    }
  }
  @media (min-width: 960px) {
    .ledajans-channels-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }
  }
  .ledajans-channel-card {
    background: #ffffff;
    padding: 1.35rem 1.15rem 1.15rem;
    border-radius: 1rem;
    border: 1px solid #ebe4dc;
    box-shadow: 0 2px 10px rgba(120, 80, 40, 0.05);
    transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 168px;
    min-width: 0;
    text-decoration: none !important;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .ledajans-channel-card:hover {
    border-color: #f0c9b0;
    box-shadow: 0 8px 22px rgba(244, 111, 44, 0.1);
    transform: translateY(-3px);
  }
  .ledajans-channel-logo-wrapper {
    width: 100%;
    min-height: 72px;
    margin-bottom: 0.65rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ledajans-channel-logo {
    width: auto;
    max-width: 100%;
    height: auto;
    max-height: 64px;
    object-fit: contain;
    display: block;
  }
  .ledajans-channel-logo-ledkasa {
    max-height: 56px;
    width: 56px;
    border-radius: 12px;
  }
  .ledajans-channel-name {
    margin: 0;
    font-size: 0.9375rem;
    font-weight: 700;
    color: #1f2937;
    line-height: 1.3;
  }
  .ledajans-channel-url {
    margin: 0.35rem 0 0 0;
    font-size: 0.75rem;
    font-weight: 500;
    color: #ea6a2d;
    line-height: 1.3;
  }
</style>
