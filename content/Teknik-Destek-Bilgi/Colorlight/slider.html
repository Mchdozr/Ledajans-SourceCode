<!-- LEDAJANS - Colorlight Görsel Slider (Kesintisiz Sonsuz) -->
<style>
    .ledajans-colorlight-slider{
      padding: 2.2rem 0;
      background: #f9fafb;
      overflow: hidden;
      position: relative;
    }
    @media (min-width:768px){
      .ledajans-colorlight-slider{ padding: 3rem 0; }
    }
    
    .ledajans-colorlight-slider::before,
    .ledajans-colorlight-slider::after{
      content:"";
      position:absolute;
      top:0; bottom:0;
      width:64px;
      z-index:2;
      pointer-events:none;
    }
    .ledajans-colorlight-slider::before{
      left:0;
      background: linear-gradient(90deg,#f9fafb 0%,rgba(249,250,251,0) 100%);
    }
    .ledajans-colorlight-slider::after{
      right:0;
      background: linear-gradient(270deg,#f9fafb 0%,rgba(249,250,251,0) 100%);
    }
    
    .ledajans-colorlight-track{
      display:flex;
      width:max-content;
      will-change: transform;
      animation: ledajans-colorlight-scroll 28s linear infinite;
    }
    
    .ledajans-colorlight-item{
      flex:0 0 auto;
      width:220px;
      height:130px;
      margin:0 .75rem;
      border-radius:14px;
      overflow:hidden;
      background:#fff;
      border:1px solid #e5e7eb;
      box-shadow:0 6px 14px rgba(15,23,42,.06);
    }
    @media (min-width:768px){
      .ledajans-colorlight-item{
        width:300px;
        height:170px;
        margin:0 1rem;
      }
    }
    
    .ledajans-colorlight-item a{
      display:block;
      width:100%;
      height:100%;
    }
    .ledajans-colorlight-item img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transition:transform .25s ease;
    }
    .ledajans-colorlight-item:hover img{ transform:scale(1.03); }
    
    /* 3 set olduğu için 1 set kadar kaydırıp başa sarar */
    @keyframes ledajans-colorlight-scroll{
      from{ transform:translateX(0); }
      to{ transform:translateX(-33.333%); }
    }
    </style>
