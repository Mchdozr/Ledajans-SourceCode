<!-- 
  LEDAJANS BreadcrumbList Schema Templates (JSON-LD)
  Her sayfa türüne göre uygun breadcrumb template'i kullanılmalıdır.
  WordPress Header/Footer veya sayfa bazlı ekleme yapılabilir.
-->

<!-- ========================================== -->
<!-- TEMPLATE 1: Ürün Kategori Sayfaları        -->
<!-- Ana Sayfa → Ürünler → [Ürün Kategori]      -->
<!-- ========================================== -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Ana Sayfa",
      "item": "https://ledajans.com/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Ürünler",
      "item": "https://ledajans.com/led-ekran/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{URUN_KATEGORI_ADI}}",
      "item": "https://ledajans.com/led-ekran/{{URUN_KATEGORI_SLUG}}/"
    }
  ]
}
</script>

<!-- ========================================== -->
<!-- TEMPLATE 2: Blog Yazısı Sayfaları          -->
<!-- Ana Sayfa → Blog → [Blog Yazısı]           -->
<!-- ========================================== -->
<script type="application/ld+json">
{

    {
      "@type": "ListItem",
      "position": 1,
      "name": "Ana Sayfa",
      "item": "https://ledajans.com/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Blog",
      "item": "https://ledajans.com/blog/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{BLOG_YAZISI_BASLIK}}",
      "item": "https://ledajans.com/blog/{{BLOG_YAZISI_SLUG}}/"
    }
  ]
}
</script>

<!-- ========================================== -->
<!-- TEMPLATE 3: Şehir LED Ekran Sayfaları      -->
<!-- Ana Sayfa → [Şehir] LED Ekran              -->
<!-- ========================================== -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Ana Sayfa",
      "item": "https://ledajans.com/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{SEHIR}} LED Ekran",
      "item": "https://ledajans.com/{{SEHIR_SLUG}}-led-ekran/"
    }
  ]
}
</script>
