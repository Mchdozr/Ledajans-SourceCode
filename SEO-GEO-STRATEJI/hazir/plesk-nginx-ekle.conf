# LEDAJANS — Plesk > Websites & Domains > ledajans.com > Apache & nginx Settings
#           > "Additional nginx directives" kutusunun EN ÜSTÜNE yapıştırın, OK, sonra önbelleği temizleyin.
# Görünüm, metin, title, H1 değişmez. "led ekran" sayfalarının (/, /led-ekran/) adresine dokunulmaz.
# Geri alma: bu satırları silip OK demek yeterli.

# 1) llms.txt / robots.txt Türkçe karakterleri doğru okunsun (şu an "text/plain" charset'siz gidiyor)
charset utf-8;

# 2) Gösterim almış eski adresleri kendi konusunun sayfasına taşı (şu an hepsi /projeler/ ya da anasayfaya gidiyor)
rewrite ^/case/ic-mekan-led-ekran/?$   /ic-mekan-led-ekran/  permanent;
rewrite ^/case/dis-mekan-led-ekran/?$  /dis-mekan-led-ekran/ permanent;
rewrite ^/case/kontrol-kartlari/?$     /kontrol-kartlari/    permanent;
rewrite ^/case/rental-ekran/?$         /rental-ekran/        permanent;
rewrite ^/case/ic-mekan-rgb-panel/?$   /ic-mekan-rgb-panel/  permanent;
rewrite ^/led-ekran-kiralama/?$        /rental-ekran/        permanent;
rewrite ^/dis-mekan-led-ekranlar/?$    /dis-mekan-led-ekran/ permanent;
rewrite ^/p10-panel-kirmizi-4/?$       /p10-panel/           permanent;

# Kontrol (her biri tek adımda 301 → hedef, hedef 200 olmalı):
#   curl -sI https://ledajans.com/case/ic-mekan-led-ekran/ | grep -i location
#   curl -sI https://ledajans.com/llms.txt | grep -i content-type     → text/plain; charset=utf-8
